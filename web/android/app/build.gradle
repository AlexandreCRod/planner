apply plugin: 'com.android.application'
// The alarm engine is Kotlin (ported from the native app), and its ringing screen is Compose.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace = "com.alex.planner.web"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.alex.planner.web"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        compose = true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    // The scheduling cases shared with the web app and the native app (repo shared/), for AlarmDomainTest.
    sourceSets {
        test.resources.srcDirs += ['../../../shared']
    }
    // Release signing: the key lives outside the repo. PLANNER_KEYSTORE_PROPERTIES (in ~/.gradle/gradle.properties)
    // points to a file with storeFile, storePassword, keyAlias and keyPassword. Without it, release builds are unsigned.
    def signingProps = new Properties()
    def signingFile = project.findProperty("PLANNER_KEYSTORE_PROPERTIES")
    if (signingFile && file(signingFile).exists()) file(signingFile).withInputStream { signingProps.load(it) }
    signingConfigs {
        if (signingProps.storeFile) {
            release {
                storeFile file(signingProps.storeFile)
                storePassword signingProps.storePassword
                keyAlias signingProps.keyAlias
                keyPassword signingProps.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (signingProps.storeFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Alarm engine: ringing screen, notifications, its own copy of the alarm data.
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
